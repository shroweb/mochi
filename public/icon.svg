<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a9fd4"/>
      <stop offset="100%" stop-color="#74b8e8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="368" cy="138" r="54" fill="#ffd600"/>
  <line x1="368" y1="64"  x2="368" y2="44"  stroke="#ffd600" stroke-width="10" stroke-linecap="round"/>
  <line x1="421" y1="85"  x2="436" y2="70"  stroke="#ffd600" stroke-width="10" stroke-linecap="round"/>
  <line x1="442" y1="138" x2="462" y2="138" stroke="#ffd600" stroke-width="10" stroke-linecap="round"/>
  <line x1="421" y1="191" x2="436" y2="206" stroke="#ffd600" stroke-width="10" stroke-linecap="round"/>

  <!-- Left ear (outer) -->
  <polygon points="148,228 172,106 248,200" fill="#e8c47e"/>
  <!-- Left ear (inner) -->
  <polygon points="162,218 181,130 232,205" fill="#f4a0a8"/>

  <!-- Right ear (outer) -->
  <polygon points="364,228 340,106 264,200" fill="#e8c47e"/>
  <!-- Right ear (inner) -->
  <polygon points="350,218 331,130 280,205" fill="#f4a0a8"/>

  <!-- Face -->
  <circle cx="256" cy="308" r="148" fill="#f5e0a0"/>

  <!-- Left eye (happy arc) -->
  <path d="M192 283 Q212 263 232 283" stroke="#4a2e10" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Right eye (happy arc) -->
  <path d="M280 283 Q300 263 320 283" stroke="#4a2e10" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="256" cy="316" rx="14" ry="10" fill="#e86878"/>

  <!-- Mouth -->
  <path d="M244 326 Q256 342 268 326" stroke="#4a2e10" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="120" y1="305" x2="236" y2="314" stroke="#4a2e10" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
  <line x1="120" y1="325" x2="236" y2="325" stroke="#4a2e10" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
  <!-- Whiskers right -->
  <line x1="276" y1="314" x2="392" y2="305" stroke="#4a2e10" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
  <line x1="276" y1="325" x2="392" y2="325" stroke="#4a2e10" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
</svg>
